name: Keep Supabase Alive

# Objectif : générer une activité DB réelle chaque jour pour limiter
# la pause automatique des projets Free (inactivité ~7 jours).
# Doc Supabase : « a few user requests to the database each day ».
# Note : seul le plan Pro garantit l'absence de pause.

on:
  schedule:
    # Tous les jours à 12h UTC (GitHub peut retarder les cron ; le quotidien
    # laisse une marge si un run est sauté).
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (avec retries)
        id: ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Secrets manquants : SUPABASE_URL et/ou SUPABASE_ANON_KEY."
            exit 1
          fi

          BASE="${SUPABASE_URL%/}"
          # Plusieurs lectures légères = « quelques requêtes » DB par jour
          ENDPOINTS=(
            "${BASE}/rest/v1/document_types?select=id&limit=1"
            "${BASE}/rest/v1/etablissements?select=id&limit=1"
            "${BASE}/rest/v1/epreuves?select=id&limit=1"
          )

          MAX_ATTEMPTS=4
          SLEEP_SECONDS=20

          for URL in "${ENDPOINTS[@]}"; do
            echo "Requête : GET $URL"
            ATTEMPT=1
            while true; do
              set +e
              HTTP_CODE=$(curl -sS --connect-timeout 20 --max-time 60 \
                -o /tmp/supabase-ping-body.txt -w "%{http_code}" \
                "$URL" \
                -H "apikey: ${SUPABASE_ANON_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
                -H "Prefer: count=exact")
              CURL_EXIT=$?
              set -e

              if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "Code HTTP : $HTTP_CODE"
                echo "Réponse : $(head -c 200 /tmp/supabase-ping-body.txt)"
                break
              fi

              echo "Échec tentative ${ATTEMPT}/${MAX_ATTEMPTS} (curl=${CURL_EXIT}, http=${HTTP_CODE:-n/a})"
              if [ -f /tmp/supabase-ping-body.txt ]; then
                echo "Corps : $(head -c 300 /tmp/supabase-ping-body.txt)"
              fi

              if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
                echo "Échec définitif pour $URL"
                exit 1
              fi

              ATTEMPT=$((ATTEMPT + 1))
              echo "Nouvelle tentative dans ${SLEEP_SECONDS}s…"
              sleep "$SLEEP_SECONDS"
            done
          done

          echo "Succès : activité DB enregistrée sur Supabase (${#ENDPOINTS[@]} requêtes)."

  notify:
    needs: ping
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer le résultat par email (Brevo)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.KEEP_ALIVE_NOTIFY_EMAIL }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          PING_RESULT: ${{ needs.ping.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${NOTIFY_EMAIL:-}" ] || [ -z "${BREVO_API_KEY:-}" ]; then
            echo "Notification email désactivée (ajoutez KEEP_ALIVE_NOTIFY_EMAIL et BREVO_API_KEY dans les secrets GitHub)."
            exit 0
          fi

          if [ -z "${BREVO_SENDER_EMAIL:-}" ]; then
            echo "BREVO_SENDER_EMAIL manquant : sans expéditeur vérifié, Brevo refuse l'envoi."
            exit 0
          fi

          # Construire un JSON valide (évite les accents/apostrophes qui cassent -d "...")
          python3 <<'PY'
          import json, os, urllib.error, urllib.request

          ping_result = os.environ["PING_RESULT"]
          run_url = os.environ["RUN_URL"]
          date_utc = __import__("datetime").datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S")
          sender_name = os.environ.get("BREVO_SENDER_NAME") or "Banque Epreuve"
          sender_email = os.environ["BREVO_SENDER_EMAIL"]
          notify_email = os.environ["NOTIFY_EMAIL"]
          api_key = os.environ["BREVO_API_KEY"]

          if ping_result == "success":
              subject = "[Banque Epreuve] Keep-alive Supabase — succès"
              body = (
                  "Le ping automatique Supabase s'est terminé avec succès."
                  f"<br><br>Date (UTC) : {date_utc}"
                  f"<br>Résultat : {ping_result}"
                  f'<br>Workflow : <a href="{run_url}">voir le run GitHub</a>'
              )
          else:
              subject = "[Banque Epreuve] Keep-alive Supabase — échec"
              body = (
                  "Le ping automatique Supabase a échoué."
                  f"<br><br>Date (UTC) : {date_utc}"
                  f"<br>Résultat : {ping_result}"
                  f'<br>Workflow : <a href="{run_url}">voir le run GitHub</a>'
                  "<br><br>Si le projet est en pause, restaurez-le dans le dashboard Supabase "
                  "puis relancez ce workflow. Vérifiez aussi SUPABASE_URL et SUPABASE_ANON_KEY."
              )

          payload = {
              "sender": {"name": sender_name, "email": sender_email},
              "to": [{"email": notify_email}],
              "subject": subject,
              "htmlContent": body,
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              "https://api.brevo.com/v3/smtp/email",
              data=data,
              headers={
                  "api-key": api_key,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Brevo HTTP : {resp.status}")
                  print(f"Réponse : {resp.read().decode('utf-8', errors='replace')}")
          except urllib.error.HTTPError as err:
              print(f"Brevo HTTP : {err.code}")
              print(f"Réponse : {err.read().decode('utf-8', errors='replace')}")
              raise SystemExit(1)

          print(f"Email envoyé à {notify_email} (résultat : {ping_result}).")
          PY

