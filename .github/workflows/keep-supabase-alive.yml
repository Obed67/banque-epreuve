name: Keep Supabase Alive

# Objectif : générer une activité DB réelle chaque jour pour limiter
# la pause automatique des projets Free (inactivité ~7 jours).
# Doc Supabase : « a few user requests to the database each day ».
# Note : seul le plan Pro garantit l'absence de pause.

on:
  schedule:
    # Tous les jours à 12h UTC (GitHub peut retarder les cron ; le quotidien
    # laisse une marge si un run est sauté).
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (avec retries)
        id: ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Secrets manquants : SUPABASE_URL et/ou SUPABASE_ANON_KEY."
            exit 1
          fi

          BASE="${SUPABASE_URL%/}"
          # Plusieurs lectures légères = « quelques requêtes » DB par jour
          ENDPOINTS=(
            "${BASE}/rest/v1/document_types?select=id&limit=1"
            "${BASE}/rest/v1/etablissements?select=id&limit=1"
            "${BASE}/rest/v1/epreuves?select=id&limit=1"
          )

          MAX_ATTEMPTS=4
          SLEEP_SECONDS=20

          for URL in "${ENDPOINTS[@]}"; do
            echo "Requête : GET $URL"
            ATTEMPT=1
            while true; do
              set +e
              HTTP_CODE=$(curl -sS --connect-timeout 20 --max-time 60 \
                -o /tmp/supabase-ping-body.txt -w "%{http_code}" \
                "$URL" \
                -H "apikey: ${SUPABASE_ANON_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
                -H "Prefer: count=exact")
              CURL_EXIT=$?
              set -e

              if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
                echo "Code HTTP : $HTTP_CODE"
                echo "Réponse : $(head -c 200 /tmp/supabase-ping-body.txt)"
                break
              fi

              echo "Échec tentative ${ATTEMPT}/${MAX_ATTEMPTS} (curl=${CURL_EXIT}, http=${HTTP_CODE:-n/a})"
              if [ -f /tmp/supabase-ping-body.txt ]; then
                echo "Corps : $(head -c 300 /tmp/supabase-ping-body.txt)"
              fi

              if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
                echo "Échec définitif pour $URL"
                exit 1
              fi

              ATTEMPT=$((ATTEMPT + 1))
              echo "Nouvelle tentative dans ${SLEEP_SECONDS}s…"
              sleep "$SLEEP_SECONDS"
            done
          done

          echo "Succès : activité DB enregistrée sur Supabase (${#ENDPOINTS[@]} requêtes)."

  notify:
    needs: ping
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer le résultat par email (Brevo)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.KEEP_ALIVE_NOTIFY_EMAIL }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          PING_RESULT: ${{ needs.ping.result }}
        run: |
          set -euo pipefail

          if [ -z "${NOTIFY_EMAIL:-}" ] || [ -z "${BREVO_API_KEY:-}" ]; then
            echo "Notification email désactivée (ajoutez KEEP_ALIVE_NOTIFY_EMAIL et BREVO_API_KEY dans les secrets GitHub)."
            exit 0
          fi

          SENDER_EMAIL="${BREVO_SENDER_EMAIL:-}"
          SENDER_NAME="${BREVO_SENDER_NAME:-Banque Epreuve}"

          if [ -z "$SENDER_EMAIL" ]; then
            echo "BREVO_SENDER_EMAIL manquant : sans expéditeur vérifié, Brevo refuse l'envoi."
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DATE_UTC="$(date -u '+%Y-%m-%d %H:%M:%S')"

          if [ "$PING_RESULT" = "success" ]; then
            SUBJECT="[Banque Epreuve] Keep-alive Supabase — succès"
            BODY="Le ping automatique Supabase s'est terminé avec succès.<br><br>Date (UTC) : ${DATE_UTC}<br>Résultat : ${PING_RESULT}<br>Workflow : <a href=\"${RUN_URL}\">voir le run GitHub</a>"
          else
            SUBJECT="[Banque Epreuve] Keep-alive Supabase — échec"
            BODY="Le ping automatique Supabase a échoué.<br><br>Date (UTC) : ${DATE_UTC}<br>Résultat : ${PING_RESULT}<br>Workflow : <a href=\"${RUN_URL}\">voir le run GitHub</a><br><br>Si le projet est en pause, restaurez-le dans le dashboard Supabase puis relancez ce workflow. Vérifiez aussi SUPABASE_URL et SUPABASE_ANON_KEY."
          fi

          HTTP_CODE=$(curl -sS -o /tmp/brevo-response.txt -w "%{http_code}" \
            -X POST "https://api.brevo.com/v3/smtp/email" \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"sender\":{\"name\":\"${SENDER_NAME}\",\"email\":\"${SENDER_EMAIL}\"},\"to\":[{\"email\":\"${NOTIFY_EMAIL}\"}],\"subject\":\"${SUBJECT}\",\"htmlContent\":\"${BODY}\"}")

          echo "Brevo HTTP : $HTTP_CODE"
          echo "Réponse : $(cat /tmp/brevo-response.txt)"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Échec d'envoi email Brevo."
            exit 1
          fi

          echo "Email envoyé à ${NOTIFY_EMAIL} (résultat : ${PING_RESULT})."
